          for field in ('name','phone','email','property_type','service','location','details','foto_1','foto_2','consent','bot-field'):
            assert quote.count('name="'+field+'"')==1,field
          assert 'name="form-name" value="cotizaciones-hidrolav507"' in quote
          assert 'enctype="multipart/form-data"' in html
          assert 'type="submit"' in quote
          quote_css=Path('assets/experiencia.css').read_text()
          assert '#quote-form .quote-fields-grid{display:grid' in quote_css
          assert '#quote-form .quote-photo-details' in quote_css
          assert '@media(max-width:540px)' in quote_css
          assert 'feedback.hidden=!photos.length&&!error' in Path('assets/validar-fotos.js').read_text()
          config=Path('admin/config.yml').read_text()
          assert 'file: content/assistant.json' in config
