          assert 'class="ai-chat-tile plan-highlight"' in html
          assert 'href="#cotizar" class="ai-chat-tile"' in html
          assert 'class="ai-chat-tile whatsapp"' in html
          assert 'Preguntar por nuestros servicios' in html
