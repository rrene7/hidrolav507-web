name: Validar sitio y administrador
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar archivos y enlaces locales
        run: |
          set -euo pipefail
          for p in index.html admin/index.html admin/config.yml content/site.json content/christmas.json assets/site-content.js netlify.toml assets/logo.webp assets/hero.webp assets/adoquines.webp assets/fachada.webp assets/estructura.webp; do
            test -s "$p" || { echo "Falta archivo $p"; exit 1; }
          done
          grep -q '/assets/site-content.js' index.html
          grep -q 'sveltia-cms.js' admin/index.html
          grep -q 'repo: rrene7/hidrolav507-web' admin/config.yml
          grep -q '50762730591' index.html
          node --check assets/site-content.js
          grep -q 'name: image, widget: image' admin/config.yml
          grep -q 'service-photo' assets/site-content.js
          grep -q 'service.has-photo' index.html
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('content/site.json').read_text())
          assert d['whatsapp']=='50762730591'
          html=Path('index.html').read_text()
          email='contactohidrolav507.com@gmail.com'
          assert html.count('href="mailto:'+email+'"')==2
          assert 'class="business-email"' in html
          assert 'class="footer-email"' in html
          assert len(d['services'])>=4
          promo=json.loads(Path('content/christmas.json').read_text())
          assert type(promo['enabled']) is bool, 'La visibilidad debe ser un booleano'
          assert promo['headline'] and promo['description'] and promo['cta_label']
          assert 'name: promociones' in Path('admin/config.yml').read_text()
          assert 'file: content/christmas.json' in Path('admin/config.yml').read_text()
          assert '/content/christmas.json' in Path('assets/site-content.js').read_text()
          assert 'seasonal-campaign' in Path('index.html').read_text()
          assert all(Path('.'+p).is_file() for p in (d['hero_image'], *(x['image'] for x in d['gallery'])))
          print('HTML, JS, JSON, CMS, WhatsApp y fotos OK')
          PY
      - name: Comprobar carrusel, plan 5+1 y solicitudes con fotos
        run: |
          set -euo pipefail
          test -s content/loyalty.json
          test -s content/carousel.json
          test -s assets/experiencia.js
          test -s assets/validar-fotos.js
          node --check assets/validar-fotos.js
          test -s assets/experiencia.css
          test -s privacidad.html
          test -s gracias.html
          node --check assets/experiencia.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          from html.parser import HTMLParser
          loyalty=json.loads(Path('content/loyalty.json').read_text())
          carousel=json.loads(Path('content/carousel.json').read_text())
          assert isinstance(loyalty['enabled'], bool) and 'seis meses' in loyalty['terms']
          assert isinstance(carousel['enabled'], bool) and len(carousel['slides'])>=2
          assert all(Path('.'+s['image']).exists() for s in carousel['slides'])
          config=Path('admin/config.yml').read_text()
          assert 'file: content/loyalty.json' in config
          assert 'file: content/carousel.json' in config
          index=Path('index.html').read_text()
          assert 'assets/experiencia.js' in index
          assert 'assets/experiencia.css' in index
          class FormCheck(HTMLParser):
            def __init__(self):
              super().__init__();self.form={};self.names=set()
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=='form' and d.get('id')=='quote-form':self.form=d
              if tag in ('input','textarea','select') and d.get('name'):self.names.add(d['name'])
          parser=FormCheck();parser.feed(index)
          form=parser.form
          assert form.get('name')=='cotizaciones-hidrolav507' and form.get('data-netlify')=='true'
          assert form.get('enctype')=='multipart/form-data'
          assert form.get('action')=='/gracias'
          for field in ('form-name','name','phone','email','property_type','service','location','details','foto_1','foto_2','consent','bot-field'):
            assert field in parser.names,field
          assert 'document.getElementById(\'quote-form\').addEventListener' not in index
          # La campaña navideña y el cotizador permanecen independientes del rediseño.
          assert 'class="hero hero-modern"' in index
          assert 'id="asistente-hidrolav"' in index
          assert 'class="whatsapp-label"' in index
          assert 'whatsapp-float' in index
          js=Path('assets/experiencia.js').read_text()
          css=Path('assets/experiencia.css').read_text()
          assert 'actions.insertAdjacentElement("afterend",slot)' in js
          assert 'actions.insertAdjacentElement' in js and 'document.body.append(tab,panel)' not in js
          assert '.hero.hero-modern .hero-offer-slot .offer-tab' in css
          assert 'body .whatsapp-float' in css
          assert 'bottom:clamp(96px,18vh,172px)' in css
          # La oferta abre el número del negocio y ofrece un acceso alternativo.
          assert 'https://api.whatsapp.com/send' in js
          assert 'primary.searchParams.set("phone",phone)' in js
          assert 'primary.searchParams.set("text",question)' in js
          assert 'direct.href="https://wa.me/"+phone' in js
          assert 'replace(/[^0-9]/g,"")' in js
          assert '/^507[0-9]{8}$/' in js
          assert '.offer-backup' in css
          assert 'name="cotizaciones-hidrolav507"' in index
          assert '/assets/validar-fotos.js' in index
          assert 'id="photo-feedback"' in index
          validation=Path('assets/validar-fotos.js').read_text()
          assert '7*1024*1024' in validation and 'submit' in validation
          assert 'image/jpeg' in validation and 'image/png' in validation and 'image/webp' in validation
          assert Path('content/christmas.json').exists()
          print('Posición del plan, WhatsApp, asistente y formularios OK')
          print('Carrusel, fidelidad, Netlify Forms y privacidad OK')
          PY
      - name: Comprobar integración real de IA con Cloudflare
        run: |
          set -euo pipefail
          node --check assets/assistant.js
          node --check workers/hidrolav-ai/src/index.mjs
          node --test workers/hidrolav-ai/test/worker.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          from html.parser import HTMLParser
          settings=json.loads(Path('content/assistant.json').read_text())
          assert settings['enabled'] is False and settings['endpoint']==''
          assert len(settings['greeting'])>25
          wrangler=json.loads(Path('workers/hidrolav-ai/wrangler.json').read_text())
          assert wrangler['name']=='hidrolav507-asistente'
          assert wrangler['main']=='src/index.mjs'
          assert wrangler['ai']['binding']=='AI'
          assert {r['name'] for r in wrangler['ratelimits']}=={'CHAT_RATE','CHAT_GLOBAL'}
          html=Path('index.html').read_text()
          assert 'id="ai-chat-launch"' in html
          assert 'id="ai-chat-panel"' in html
          assert 'id="ai-chat-feed"' in html
          assert 'id="ai-chat-form"' in html
          assert '/assets/assistant.css' in html and '/assets/assistant.js' in html
          assert 'name="cotizaciones-hidrolav507"' in html
          config=Path('admin/config.yml').read_text()
          assert 'file: content/assistant.json' in config
          script=Path('assets/assistant.js').read_text()
          assert '"/health"' in script
          assert 'data?.ai' in script
          assert 'config?.enabled!==true' in script
          assert 'textContent=text' in script
          assert 'credentials:"omit"' in script
          assert Path('docs/asistente-ia-cloudflare.md').exists()
          print('Integración IA, configuración CMS y privacidad OK')
          PY
      - name: Comprobar SEO local y sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import xml.etree.ElementTree as ET

          base='https://hidrolav507.netlify.app'
          root=ET.parse('sitemap.xml').getroot()
          urls=[e.text for e in root.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert len(urls)==5 and len(set(urls))==5, urls
          assert all(u.startswith(base+'/') for u in urls)
          pages=[Path('index.html')]+[Path(unquote(urlparse(u).path).lstrip('/')) for u in urls[1:]]
          assert all(f.exists() for f in pages),pages
          class Checker(HTMLParser):
            def __init__(self): super().__init__();self.title=0;self.h1=0;self.canon=[];self.desc=0
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='h1': self.h1+=1
              if t=='title': self.title+=1
              if t=='meta' and d.get('name')=='description': self.desc+=1
              if t=='link' and d.get('rel')=='canonical': self.canon.append(d.get('href'))
          for file,url in zip(pages,urls):
            p=Checker();p.feed(file.read_text())
            assert p.h1==1 and p.title==1 and p.desc==1 and p.canon==[url],(file,p.__dict__)
          text=Path('index.html').read_text()
          for url in urls[1:]: assert urlparse(url).path in text
          assert 'Disallow: /admin/' in Path('robots.txt').read_text()
          print('SEO: 5 URLs, metadatos, enlaces y rutas OK')
          PY
