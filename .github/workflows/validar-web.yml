      - name: Comprobar SEO local y sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import xml.etree.ElementTree as ET

          base='https://hidrolav507.netlify.app'
          root=ET.parse('sitemap.xml').getroot()
          urls=[e.text for e in root.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert len(urls)==7 and len(set(urls))==7, urls
          assert all(u.startswith(base+'/') for u in urls)
          pages=[Path('index.html')]+[Path(unquote(urlparse(u).path).lstrip('/')) for u in urls[1:]]
          assert all(f.exists() for f in pages),pages
          class Checker(HTMLParser):
            def __init__(self): super().__init__();self.title=0;self.h1=0;self.canon=[];self.desc=0
            def handle_starttag(self,t,a):
              d=dict(a)
              if t=='h1': self.h1+=1
              if t=='title': self.title+=1
              if t=='meta' and d.get('name')=='description': self.desc+=1
              if t=='link' and d.get('rel')=='canonical': self.canon.append(d.get('href'))
          for file,url in zip(pages,urls):
            p=Checker();p.feed(file.read_text())
            assert p.h1==1 and p.title==1 and p.desc==1 and p.canon==[url],(file,p.__dict__)
          text=Path('index.html').read_text()
          for url in urls[1:]: assert urlparse(url).path in text
          assert 'Disallow: /admin/' in Path('robots.txt').read_text()
          # Los seis servicios deben ser accesibles, tener canonical y un contenido realmente distinto.
          import json,re
          head=Path('index.html').read_text()
          schema=json.loads(re.search(r'<script type="application/ld\+json">([\s\S]*?)</script>',head).group(1))
          graph=schema['@graph']
          business=next(x for x in graph if x['@type']=='ProfessionalService')
          assert business['url']==base+'/'
          assert business['address']['addressLocality']=='La Chorrera'
          assert business['address']['addressRegion']=='Panamá Oeste'
          assert business['telephone']=='+50762730591'
          assert business['logo']==base+'/assets/logo.webp'
          offers=business['hasOfferCatalog']['itemListElement']
          assert len(offers)==6
          assert {x['itemOffered']['url'] for x in offers}==set(urls[1:])
          new_pages=['servicios/limpieza-de-pisos-de-concreto.html','servicios/limpieza-de-exteriores-comerciales.html']
          for file in new_pages:
            content=Path(file).read_text()
            assert 'Lo siento' not in content
            assert '<h2>' in content and content.count('<details>')>=3
            assert 'imagen' in content.lower() or 'fotografía' in content.lower()
            assert 'href="/#cotizar"' in content
            assert 'image' in content
            structured=json.loads(re.search(r'<script type="application/ld\+json">([\s\S]*?)</script>',content).group(1))
            types={x['@type'] for x in structured['@graph']}
            assert {'Service','WebPage','BreadcrumbList'}<=types
            assert 'https://wa.me/50762730591' in content
          for url in urls[1:5]:
            content=Path(urlparse(url).path.lstrip('/')).read_text()
            assert all('/'+p in content for p in new_pages)
          descs=[re.search(r'<meta name="description" content="([^"]+)"',p.read_text()).group(1) for p in pages]
          assert len(set(descs))==len(descs)
          # Las tarjetas visibles y sus versiones generadas por CMS tienen enlaces internos.
          site_data=json.loads(Path('content/site.json').read_text())
          cards=site_data['services']
          assert len(cards)==6
          destinations=[x['url'] for x in cards]
          assert len(set(destinations))==6
          assert {base+dest for dest in destinations}==set(urls[1:])
          assert text.count('class="service-more"')==6
          for dest in destinations: assert 'class="service-more" href="'+dest+'"' in text
          content_script=Path('assets/site-content.js').read_text()
          assert 'if(validServicePage(s.url))' in content_script
          assert 'link.href=s.url' in content_script
          assert 'link.className="service-more"' in content_script
          assert 'document.title=' not in content_script, 'No sobrescribir el título SEO con un valor genérico'
          assert 'name: url, widget: string' in Path('admin/config.yml').read_text()
          assert 'service .service-more' in Path('assets/experiencia.css').read_text()
          # En todas las páginas de servicio debe existir la ruta de navegación.
          for page,url in zip(pages[1:],urls[1:]):
            body=page.read_text()
            assert 'class="breadcrumbs"' in body,(page,'sin ruta visible')
            assert 'href="/#servicios"' in body,(page,'sin enlace hacia el listado')
            schema=json.loads(re.search(r'<script type="application/ld\+json">([\s\S]*?)</script>',body).group(1))
            trail=next((x for x in schema['@graph'] if x['@type']=='BreadcrumbList'),None)
            assert trail is not None,(page,'faltan migas estructuradas')
            assert trail['itemListElement'][-1]['item']==url,(page,'breadcrumb incorrecto')
          commercial=Path('servicios/limpieza-de-exteriores-comerciales.html').read_text()
          assert '<title>Limpieza de plazas comerciales en Panamá | HidroLav 507</title>' in commercial
          # Búsquedas sobre verdín/musgo: contenido local, enlaces útiles y sin promesas engañosas.
          acera=Path('servicios/lavado-de-aceras-y-entradas.html').read_text()
          home=Path('index.html').read_text()
          for word in ('verdín','limo','musgo','La Chorrera','Panamá Oeste'):
            assert word in acera,word
          assert '¿Pueden limpiar una acera con verdín o musgo?' in acera
          assert 'no garantiza eliminar manchas profundas' in acera
          assert '¿Pueden limpiar aceras con verdín o musgo?' in home
          assert 'href="/servicios/lavado-de-aceras-y-entradas.html"' in home
          print('SEO: 7 URLs, 6 páginas de servicio, schema, enlaces y canonical OK')
          PY
