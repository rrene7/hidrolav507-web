          assert 'credentials:"omit"' in script
          assert Path('docs/asistente-ia-cloudflare.md').exists()
          # Avatar real del usuario, chat luminoso, acciones y charla breve.
          avatar=Path('assets/hidrobot507-avatar.webp')
          assert avatar.is_file() and avatar.stat().st_size>1000
          assert avatar.read_bytes()[:4]==b'RIFF'
          assert html.count('id="ai-chat-launch"')==1
          assert html.count('id="ai-chat-launch-mobile"')==1
          assert 'className="ai-chat-mini-avatar"' in script
          assert 'assets/hidrobot507-avatar.webp' in html
          assert 'id="ai-chat-attach"' in html
          assert 'href="#cotizar" class="ai-chat-tile"' in html
          assert 'data-chat-question="¿Qué servicios ofrece HidroLav 507?"' in html
          assert 'class="ai-chat-tile whatsapp"' in html
          assert 'ai-chat-tile' in Path('assets/assistant.css').read_text()
          assert 'max-width:1279px' in Path('assets/assistant.css').read_text()
          assert 'window.innerWidth<=1279' in script
          worker=Path('workers/hidrolav-ai/src/index.mjs').read_text()
          assert 'Eres HidroBot 507' in worker and 'max_tokens:145' in worker
          assert 'Haz solo UNA pregunta' in worker
          assert 'HidroBot 507' in settings['greeting']
          # El bot debe verse nítido y ubicarse sin apretar la navegación.
          assert 'class="hidrobot-launch-copy"' in html
          assert 'Pregúntame aquí' in html
          botcss=Path('assets/assistant.css').read_text()
          assert '.navlinks .ai-nav-button::before,.nav .ai-nav-mobile::before' in botcss
          assert 'animation:none!important' in botcss
          assert '.navlinks .hidrobot-launch-copy strong' in botcss
          assert '@media(min-width:1280px)' in botcss
          assert 'position:static;right:auto;top:auto;flex-shrink:0;' in botcss
          assert '.ai-chat-panel{right:var(--hidrobot-right,18px)}' in botcss
          # En la cabecera, primero Cotización y después HidroBot.
