          assert 'nuestros planes 2+1, 4+1 y 6+1?' in script
          assert 'el.classList.contains("plan-highlight")' in script
          assert 'planWaLink=' in script and 'function showPlans()' in script and 'function choosePlan(plan)' in script
          assert 'link.target="_blank"' in script
          assert 'debes enviarlo tú mismo' in script
          assert 'ai-chat-conversion' in Path('assets/assistant.css').read_text()
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in Path('assets/assistant.css').read_text()
          assert 'inscripción' in worker
          # Enlaces de correo: Gmail web como predeterminado y mailto como alternativa.
          assert html.count('https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=contactohidrolav507.com%40gmail.com')==2
          assert html.count('href="mailto:contactohidrolav507.com@gmail.com"')==2
          assert 'business-email-fallback' in html
          assert 'footer-email-fallback' in html
