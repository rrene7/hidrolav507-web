backend:
  name: github
  repo: rrene7/hidrolav507-web
  branch: main
  auth_methods: [token]

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: web
    label: Mi página web
    files:
      - name: inicio
        label: Editar HidroLav 507
        file: content/site.json
        format: json
        fields:
          - {label: Nombre de la empresa, name: business_name, widget: string}
          - {label: Marca corta, name: brand_short, widget: string}
          - {label: WhatsApp (incluye 507 sin símbolos), name: whatsapp, widget: string}
          - {label: Lema, name: tagline, widget: string}
          - {label: Etiqueta superior, name: hero_eyebrow, widget: string}
          - {label: Título principal, name: hero_title, widget: string}
          - {label: Título destacado, name: hero_highlight, widget: string}
          - {label: Descripción de portada, name: hero_text, widget: text}
          - {label: Fotografía de portada, name: hero_image, widget: image}
          - {label: Descripción de portada, name: hero_image_description, widget: string}
          - {label: Introducción de servicios, name: intro_services, widget: text}
          - label: Servicios
            name: services
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Fotografía del servicio (reemplaza al icono), name: image, widget: image, required: false, hint: "Sube una foto horizontal JPG, PNG o WebP."}
              - {label: Icono si todavía no hay fotografía, name: icon, widget: string, required: false, default: "💧"}
              - {label: Servicio, name: title, widget: string}
              - {label: Página informativa del servicio (enlace interno /servicios/...), name: url, widget: string, required: false, hint: "Utiliza sólo una URL interna ya existente, por ejemplo /servicios/lavado-de-aceras-y-entradas.html. La tarjeta mostrará el enlace Conocer el servicio."}
              - {label: Descripción, name: description, widget: text}
          - {label: Título de cobertura, name: coverage_title, widget: string}
          - {label: Texto de cobertura, name: coverage_text, widget: text}
          - {label: Zonas atendidas, name: areas, widget: list, field: {label: Zona, name: area, widget: string}}
          - {label: Promoción o aviso, name: announcement, widget: string, required: false}

  - name: galeria
    label: Galería de fotos individuales
    files:
      - name: mis_fotos
        label: Fotos sueltas (sin comparación)
        file: content/galeria.json
        format: json
        fields:
          - {label: Título de la galería, name: title, widget: string}
          - {label: Texto introductorio, name: intro, widget: text}
          - label: Mis fotografías
            name: gallery
            widget: list
            required: false
            summary: "{{fields.title}}"
            hint: "Úsala para fotos individuales. Si tienes una foto ANTES y otra DESPUÉS del mismo trabajo, NO las subas separadas aquí: entra en «Antes y después (mis trabajos)» y crea un único proyecto con ambas imágenes."
            fields:
              - {label: Subir fotografía, name: image, widget: image, hint: "Selecciona o arrastra una foto desde tu equipo. Se guardará en la carpeta de medios de la web."}
              - {label: Título que verán los clientes, name: title, widget: string}
              - {label: Descripción breve de la foto (accesibilidad y SEO), name: description, widget: string, hint: "Describe lo que aparece realmente en la imagen, por ejemplo: Limpieza a presión de acera en La Chorrera."}
              - {label: Confirmo que es una foto real de HidroLav 507, name: is_real, widget: boolean, default: false, hint: "Márcalo solo si la imagen pertenece a un trabajo real realizado por tu empresa."}

  - name: resultados
    label: Antes y después · Comparador de trabajos
    files:
      - name: comparaciones
        label: Añadir trabajo con fotos ANTES y DESPUÉS
        file: content/resultados.json
        format: json
        fields:
          - {label: Activar publicación de comparaciones cuando haya fotos reales (se oculta si está vacía), name: enabled, widget: boolean, default: true, hint: "Esta sección no aparecerá en la web hasta que subas al menos un proyecto con ANTES y DESPUÉS, ambas fotos diferentes y la casilla de verificación marcada."}
          - {label: Título, name: headline, widget: string}
          - {label: Introducción, name: intro, widget: text}
          - label: Proyectos con antes y después
            name: projects
            widget: list
            required: false
            summary: "{{fields.title}}"
            hint: "POR CADA TRABAJO: pulsa Añadir un proyecto, escribe su nombre, selecciona Foto ANTES y Foto DESPUÉS del mismo lugar, y marca la casilla de fotos reales. Las dos imágenes se mostrarán juntas en un comparador deslizable. No las cargues por separado en Galería de fotos individuales."
            fields:
              - {label: Nombre del proyecto, name: title, widget: string}
              - {label: Zona o tipo de propiedad (opcional), name: area, widget: string, required: false}
              - {label: Breve explicación (opcional), name: description, widget: text, required: false}
              - {label: Foto ANTES (superficie sucia), name: before, widget: image, hint: "Sube foto original de la superficie SUCIA, antes del lavado. Debe ser del mismo encuadre y orientación que la foto DESPUÉS."}
              - {label: Foto DESPUÉS (superficie limpia), name: after, widget: image, hint: "Sube foto original del mismo lugar ya LIMPIO. Usa el mismo encuadre y proporción para que las imágenes coincidan cuando muevas la división."}
              - {label: Descripción accesible del antes, name: alt_before, widget: string, required: false}
              - {label: Descripción accesible del después, name: alt_after, widget: string, required: false}
              - {label: Confirmo que ambas fotos son reales y del mismo trabajo de HidroLav 507, name: is_real, widget: boolean, default: false, hint: "Si no está marcada, el proyecto no se publica."}

  - name: promociones
    label: Promociones y campañas
    files:
      - name: navidad2026
        label: Navidad 2026
        file: content/christmas.json
        format: json
        fields:
          - {label: Mostrar campaña navideña en la página, name: enabled, widget: boolean, default: true, hint: "Activa para mostrar el banner o desactiva para ocultarlo."}
          - {label: Texto superior, name: eyebrow, widget: string}
          - {label: Título navideño, name: headline, widget: string}
          - {label: Descripción comercial, name: description, widget: text}
          - {label: Texto del botón, name: cta_label, widget: string}
          - {label: Fotografía navideña (opcional), name: photo, widget: image, required: false, hint: "Si no tienes fotos reales, conserva este campo vacío; aparecerá un diseño festivo sin fotografía."}

  - name: fidelidad
    label: Programa Cliente Frecuente
    files:
      - name: planes_cliente_frecuente
        label: Planes 2+1 / 4+1 / 6+1
        file: content/loyalty.json
        format: json
        fields:
          - {label: Mostrar anuncio flotante, name: enabled, widget: boolean, default: true}
          - {label: Texto corto de la burbuja, name: mini_label, widget: string}
          - {label: Etiqueta de la oferta, name: eyebrow, widget: string}
          - {label: Título del programa, name: headline, widget: string}
          - {label: Explicación breve, name: description, widget: text}
          - label: Opciones Cliente Frecuente
            name: plans
            widget: list
            summary: "{{fields.code}} · {{fields.months}} meses"
            fields:
              - {label: Identificador del plan (ej. 2+1), name: code, widget: string}
              - {label: Limpiezas pagadas, name: paid, widget: number, value_type: int, min: 1}
              - {label: Limpiezas de cortesía, name: bonus, widget: number, value_type: int, min: 1}
              - {label: Plazo en meses, name: months, widget: number, value_type: int, min: 1}
          - {label: Condiciones de la promoción, name: terms, widget: text}
          - {label: Texto del botón, name: cta, widget: string}

  - name: portada
    label: Imágenes de portada
    files:
      - name: carrusel
        label: Carrusel principal
        file: content/carousel.json
        format: json
        fields:
          - {label: Activar carrusel, name: enabled, widget: boolean, default: true}
          - {label: Segundos por imagen, name: interval_seconds, widget: number, default: 6, min: 4, max: 15, value_type: int}
          - label: Fotografías de portada
            name: slides
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - {label: Fotografía, name: image, widget: image}
              - {label: Título corto, name: caption, widget: string}
              - {label: Descripción accesible, name: alt, widget: string}
              - {label: ¿Foto real de un trabajo nuestro?, name: is_real, widget: boolean, default: false}

  - name: inteligencia_artificial
    label: Asistente IA
    files:
      - name: configuracion
        label: Conexión Cloudflare Workers AI
        file: content/assistant.json
        format: json
        fields:
          - {label: Activar asistente IA (después de desplegar Worker), name: enabled, widget: boolean, default: false, hint: "Activa únicamente después de probar tu Worker en Cloudflare. Si no se conecta, el botón no aparecerá."}
          - {label: URL del endpoint HTTPS, name: endpoint, widget: string, required: false, hint: "Ejemplo: https://hidrolav507-asistente.TU-SUBDOMINIO.workers.dev/chat. Es una URL pública, nunca una clave."}
          - {label: Saludo inicial, name: greeting, widget: text}
          - {label: Aviso de privacidad del chat, name: notice, widget: text}
